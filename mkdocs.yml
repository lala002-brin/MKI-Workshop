                  quantum-simulation/hands-on/dft-u.md

              - Spin Orbit Coupling:
                  quantum-simulation/hands-on/spin-orbit-coupling.md

              - Phonon:
                  quantum-simulation/hands-on/phonon.md

              - Wannier Function:
                  quantum-simulation/hands-on/wannier.md
  - 🧩 System Design:

      - Overview:
          system-design/index.md

      - Molecular Building:
          atomistic-simulation/molecular-building.md

      - Packmol System Generation:
          atomistic-simulation/packmol.md

      - Interface Construction:
          system-design/graphite-interface.md


  - 🚀 Accelerated Materials Simulation:

      - Overview:
          atomistic-simulation/index.md

      - Molecular Dynamics Fundamentals:
          atomistic-simulation/md.md

      - DC-DFTB-MD Workflow:

          - Overview:
              atomistic-simulation/dc-dftb-md.md

          - Input Preparation:
              atomistic-simulation/dc-dftb-input.md

          - HPC Execution:
              atomistic-simulation/dc-dftb-hpc.md

          - Trajectory Output:
              atomistic-simulation/dc-dftb-trajectory.md
  - 💻 HPC Environment:

      - Overview:
          hpc-environment/index.md

      - Job Submission:
          hpc-environment/job-submission.md


  - 📊 Transport Analysis:

      - Overview:
          atomistic-simulation/transport-analysis.md

      - Mean Square Displacement (MSD):
          atomistic-simulation/msd.md

      - Diffusion Coefficient:
          atomistic-simulation/diffusion-coefficient.md

