site_name: Computational Materials Science Workshop
site_description: Integrating First-Principles Calculation, High Performance Computing, and Artificial Intelligence for Materials Discovery

site_author: 
  BRIN - ITB - Masyarakat Komputasi Indonesia


repo_name: MKI-Workshop
repo_url: https://github.com/lala002-brin/MKI-Workshop


theme:

  theme:

  name: material

  custom_dir: docs/overrides
 
  features:

  - navigation.sections
  - navigation.expand
  - navigation.top
  - navigation.instant

  - content.code.copy

  - toc.follow

  palette:

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode


    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode



markdown_extensions:

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences

  - admonition

  - attr_list

  - md_in_html

  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:

  - search
  - mkdocs-jupyter


nav:

  - 🏠 Home:
      - Overview: index.md


  - 🚀 Start Here:
      - Workshop Introduction:
          start-here/workshop-guide.md
      - Computational Workflow:
          start-here/workflow.md



  - 🧱 Foundation:
      - Computational Materials Science:
          foundation/index.md
      - Materials Informatics:
          foundation/materials-informatics.md



  - ⚛ First-Principles Calculation:

      - Overview:
          quantum-simulation/index.md


      - Setup:

          - Installation:
              quantum-simulation/setup/installation.md

          - HPC Environment:
              quantum-simulation/setup/hpc.md

          - Pseudopotential:
              quantum-simulation/setup/pseudopotential.md



      - Theory:

          - DFT Overview:
              quantum-simulation/theory/dft-overview.md

          - Kohn-Sham Equations:
              quantum-simulation/theory/kohn-sham.md

          - Hartree-Fock:
              quantum-simulation/theory/hartree-fock.md

          - Wannier Basis:
              quantum-simulation/theory/wannier.md

          - Computational Complexity:
              quantum-simulation/theory/computational-complexity.md



      - Hands-on Tutorial:

          - Overview:
              quantum-simulation/hands-on/index.md

          - SCF Calculation:
              quantum-simulation/hands-on/scf.md

          - Convergence Testing:
              quantum-simulation/hands-on/convergence-testing.md

          - Geometry Optimization:
              quantum-simulation/hands-on/relaxation.md

          - Band Structure:
              quantum-simulation/hands-on/band-structure.md

          - Density of States:
              quantum-simulation/hands-on/density-of-states.md

          - DFT+U:
              quantum-simulation/hands-on/dft-u.md

          - Spin Orbit Coupling:
              quantum-simulation/hands-on/spin-orbit-coupling.md

          - Phonon:
              quantum-simulation/hands-on/phonon.md

          - Wannier Function:
              quantum-simulation/hands-on/wannier.md

          - Molecular Dynamics:
              quantum-simulation/hands-on/molecular-dynamics.md



  - 🚀 Accelerated Materials Simulation:

      - DFTB+ Workflow:
          atomistic-simulation/index.md

      - Structure Optimization:
          atomistic-simulation/optimization.md



  - 🤖 Machine Learning Potential:

      - AI for Materials Simulation:
          ai-acceleration/index.md

      - MACE Workflow:
          ai-acceleration/mace.md



  - 💻 High Performance Computing:

      - HPC Environment:
          hpc-environment/index.md

      - Job Submission:
          hpc-environment/job-submission.md



  - 🧪 Hands-on Research Cases:

      - Overview:
          hands-on-project/index.md


      - Graphene Electronic Structure:
          hands-on-project/research-cases/graphene/index.md


      - Silicon Semiconductor:
          hands-on-project/research-cases/silicon/index.md


      - Battery Material Simulation:
          hands-on-project/research-cases/battery-material/index.md


      - Surface Catalysis:
          hands-on-project/research-cases/surface-catalysis/index.md


      - Molecular Dynamics:
          hands-on-project/research-cases/molecular-dynamics/index.md

  - 🤖 AI Help Center:

      - Overview:
          resources/ai-help/index.md
      - AI Chat Assistant:
          resources/ai-help/chat.md
      
      - 💻 Linux Command Assistant:
           resources/ai-help/linux-command.md
      - ⚛ Quantum ESPRESSO Assistant:
          resources/ai-help/quantum-espresso.md

  - 📚 References:

      - Software:
          references/software.md

      - Learning Resources:
          references/resources.md


extra:

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/lala002-brin/MKI-Workshop


  workshop_progress:

    title: "Workshop Roadmap"

    modules:

      - "01 Foundation"

      - "02 Quantum Simulation"

      - "03 Accelerated Simulation"

      - "04 AI Materials"

      - "05 HPC Computing"

      - "06 Research Cases"

