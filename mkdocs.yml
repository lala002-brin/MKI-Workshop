site_name: MKI Computational Materials Science Workshop

site_description: >
  Integrating First-Principles, HPC & AI for Materials Discovery
  Computational materials science workshop by MKI and BRIN.

site_author: >
  BRIN - ITB - Masyarakat Komputasi Indonesia


repo_name: MKI-Workshop

repo_url: https://github.com/lala002-brin/MKI-Workshop

theme:
  name: material
  copyright: ""
  logo: assets/images/mki-logo.jpeg

  favicon: assets/images/mki-logo.jpeg

  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link

  palette:

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode


    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - pymdownx.details

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.superfences:
      custom_fences:

        - name: mermaid
          class: mermaid

        - name: yaml
          class: yaml
plugins:

  - search

  - mkdocs-jupyter:
      execute: false
      include_source: true
nav:

  - 🏠 Home:
      - Overview:
          index.md


  - 🚀 Start Here:
      - Workshop Guide:
          start-here/workshop-guide.md

      - Computational Workflow:
          start-here/workflow.md


  - 🧱 Foundation:
      - Overview:
          foundation/index.md

      - Density Functional Theory:
          foundation/dft.md

      - Material Fundamentals:
          foundation/materials-informatics.md


  - ⚛ Quantum Simulation:
      - Overview:
          quantum-simulation/index.md

      - Theory:
          quantum-simulation/theory/dft-overview.md

      - Hands-on Calculation:
          quantum-simulation/hands-on/index.md


  - 🔬 Atomistic Simulation:
      - Overview:
          atomistic-simulation/index.md

      - Molecular Dynamics:
          atomistic-simulation/md.md

      - Transport Analysis:
          atomistic-simulation/transport-analysis.md


  - 💻 HPC Environment:
      - Overview:
          hpc-environment/index.md

      - Job Submission:
          hpc-environment/job-submission.md


  - 🤖 AI Acceleration:
      - Overview:
          ai-acceleration/index.md

      - MACE Workflow:
          ai-acceleration/mace.md


  - 🧪 Research Application:
      - Hands-on Cases:
          hands-on-project/index.md


  - 📚 Resources:
      - AI Help:
          resources/ai-help/index.md

      - References:
          references/resources.md

extra:
  generator: false
  social:

    - icon: fontawesome/brands/github
      link: https://github.com/lala002-brin/MKI-Workshop


  workshop_progress:

    title: "Workshop Roadmap"

    modules:

      - "01 Foundation"

      - "02 First-Principles Simulation"

      - "03 System Design"

      - "04 Accelerated Atomistic Simulation"

      - "05 HPC Environment"

      - "06 AI Materials"

      - "07 Research Cases"


copyright: >
  MKI × BRIN Computational Materials Science Workshop
  <br>
  Developed for scientific computing education


extra_css:

  - assets/stylesheets/chat.css
  - stylesheets/home.css
  - stylesheets/extra-v2.css

extra_javascript:

  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - assets/javascripts/chat.js
  - javascripts/home-parallax.js
  - javascripts/features-reveal.js 
  - javascripts/workflow-flow.js  
  - javascripts/research-reveal.js
  - javascripts/scroll-reveal.js
