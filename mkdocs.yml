site_name: MKI Computational Materials Science Workshop

site_description: >
  Integrating First-Principles, HPC & AI for Materials Discovery
  Computational materials science workshop by MKI and BRIN.

site_author: >
  BRIN - ITB - Masyarakat Komputasi Indonesia


repo_name: MKI-Workshop

repo_url: https://github.com/lala002-brin/MKI-Workshop

theme:
  name: material

  logo: assets/images/mki-logo.jpeg

  favicon: assets/images/mki-logo.jpeg

  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link

  palette:

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode


    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - pymdownx.details

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.superfences:
      custom_fences:

        - name: mermaid
          class: mermaid

        - name: yaml
          class: yaml
plugins:

  - search

  - mkdocs-jupyter:
      execute: false
      include_source: true
nav:

  - 🏠 Home:
      - Overview:
          index.md


  - 🚀 Start Here:

      - Workshop Guide:
          start-here/workshop-guide.md

      - Computational Workflow:
          start-here/workflow.md


  - 🧱 Foundation:

      - Computational Materials Science:
          foundation/index.md

      - Materials Informatics:
          foundation/materials-informatics.md
  - ⚛ First-Principles Simulation:

      - Overview:
          quantum-simulation/index.md


      - Setup Environment:

          - Installation:
              quantum-simulation/setup/installation.md

          - HPC Environment:
              quantum-simulation/setup/hpc.md

          - Pseudopotential:
              quantum-simulation/setup/pseudopotential.md


      - Theory:

          - DFT Overview:
              quantum-simulation/theory/dft-overview.md

          - Kohn-Sham Equations:
              quantum-simulation/theory/kohn-sham.md

          - Hartree-Fock:
              quantum-simulation/theory/hartree-fock.md

          - Computational Complexity:
              quantum-simulation/theory/computational-complexity.md


      - Hands-on Tutorial:

          - Overview:
              quantum-simulation/hands-on/index.md

          - SCF Calculation:
              quantum-simulation/hands-on/scf.md

          - Convergence Testing:
              quantum-simulation/hands-on/convergence-testing.md

          - Geometry Optimization:
              quantum-simulation/hands-on/relaxation.md

          - Electronic Structure Analysis:
              quantum-simulation/hands-on/density-of-states.md

          - Band Structure:
              quantum-simulation/hands-on/band-structure.md

          - Advanced Topics:
