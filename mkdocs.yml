site_name: Computational Materials Science Workshop
site_description: Integrating First-Principles Calculation, High Performance Computing, and Artificial Intelligence for Materials Discovery

site_author: 
  BRIN - ITB - Masyarakat Komputasi Indonesia


repo_name: MKI-Workshop
repo_url: https://github.com/lala002-brin/MKI-Workshop


theme:

  name: material

  features:

  - navigation.sections
  - navigation.expand
  - navigation.top
  - navigation.instant

  - content.code.copy

  - toc.follow

  palette:

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode


    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode



markdown_extensions:

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences

  - admonition

  - attr_list

  - md_in_html

  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:

  - search
  - mkdocs-jupyter


nav:


  - Home:
      - Overview: index.md



  - 00 Start Here:

      - Workshop Introduction:
          start-here/workshop-guide.md

      - Computational Workflow:
          start-here/workflow.md



  - 01 Computational Materials Science:

      - Introduction:
          foundation/index.md

      - Materials Informatics:
          foundation/materials-informatics.md



  - 02 First-Principles Calculation:

      - Overview:
          quantum-simulation/index.md


      - Setup:

          - Installation:
              quantum-simulation/setup/installation.md

          - HPC Environment:
              quantum-simulation/setup/hpc.md

          - Pseudopotential:
              quantum-simulation/setup/pseudopotential.md

      - Theory:

          - Overview:
              quantum-simulation/theory/index.md

          - Problem Statement:
              quantum-simulation/theory/problem-statement.md

          - Hartree-Fock:
              quantum-simulation/theory/hartree-fock.md

          - DFT Overview:
              quantum-simulation/theory/dft-overview.md

          - Wannier Basis:
              quantum-simulation/theory/wannier.md

      - Hands-on:

          - SCF Calculation:
              quantum-simulation/hands-on/scf.md
          - Notebook:
              quantum-simulation/hands-on/01_QE_SCF_Test.ipynb

          - Geometry Optimization:
              quantum-simulation/hands-on/relaxation.md

          - Band Structure:
              quantum-simulation/hands-on/band-structure.md


  - 03 Accelerated Materials Simulation:


      - DFTB+ Workflow:
          atomistic-simulation/index.md


      - Structure Optimization:
          atomistic-simulation/optimization.md



  - 04 Machine Learning Potential:


      - AI for Materials Simulation:
          ai-acceleration/index.md


      - MACE Workflow:
          ai-acceleration/mace.md



  - 05 High Performance Computing:


      - HPC Environment:
          hpc-environment/index.md


      - Job Submission:
          hpc-environment/job-submission.md



  - 06 Hands-on Project:


      - Project Guide:
          final-project/index.md



  - References:

      - Software:
          references/software.md

      - Learning Resources:
          references/resources.md



extra:

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/lala002-brin/MKI-Workshop


copyright:
  Copyright © 2026 BRIN - ITB - MKI

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
