  - assets/stylesheets/chat.css
  - stylesheets/home.css
  - stylesheets/extra-v2.css
  - stylesheets/file-editor.css
  - stylesheets/pretest.css
  - stylesheets/script-lib.css
  - stylesheets/w_day2.css
  - stylesheets/dftb-workshop.css

extra_javascript:

  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - javascripts/home-parallax.js
  - javascripts/features-reveal.js
  - javascripts/workflow-flow.js
  - javascripts/research-reveal.js
  - javascripts/scroll-reveal.js
  - javascripts/file-editor.js
  - javascripts/worksheet.js
  - javascripts/lifec-viewer.js
  - javascripts/session1.js
  - javascripts/pretest.js
  - javascripts/md-analysis-worksheet.js
  - javascripts/scipt-library.js
  
  - assets/javascripts/chat.js
