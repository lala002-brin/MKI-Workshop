site_name: MKI Computational Materials Science Workshop

site_description: >
  Integrating First-Principles, HPC & AI for Materials Discovery
  Computational materials science workshop by MKI and BRIN.

site_author: >
  BRIN - ITB - Masyarakat Komputasi Indonesia


repo_name: MKI-Workshop

repo_url: https://github.com/lala002-brin/MKI-Workshop

theme:
  name: material
  custom_dir: overrides
  copyright: ""
  logo: assets/images/mki-logo.jpeg

  favicon: assets/images/mki-logo.jpeg

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - navigation.tabs.sticky
    - navigation.path  

palette:

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode


    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - pymdownx.details

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.superfences:
      custom_fences:

        - name: mermaid
          class: mermaid

        - name: yaml
          class: yaml
plugins:

  - search

  - mkdocs-jupyter:
      execute: false
      include_source: true
nav:

  - Home: index.md
  - 📝 Pretest: hands-on-project/day-1/pretest.md
  - Start Here:
      - Workshop Guide: start-here/workshop-guide.md
      - Computational Workflow: start-here/workflow.md
      - Required Software: software-setup.md
  - Computational Environment:
      - HPC Overview: environment/index.md
      - Access & Linux: environment/access-linux.md
      - Command Line: environment/command-line.md
      - Software Environment: environment/software-environment.md
      - Running Calculations: environment/running-calculations.md
      - Script Library: environment/script-library.md
      - HPC Practical Test: environment/hpc-practical-test.md

  - Simulation:

      - Quantum Simulation:
          - Overview: quantum-simulation/index.md
          - Modul Workshop DFT QE: hands-on-project/day-1/Komputasi Density Functional Theory (DFT)_QE.pdf
          - Modul Workshop DFT QE_2: hands-on-project/day-1/Materi workshop QE CO Pt(100).pdf
          - Theory:
              - Theory Overview: quantum-simulation/theory/index.md
              - Problem Statement: quantum-simulation/theory/problem-statement.md
              - Hartree-Fock: quantum-simulation/theory/hartree-fock.md
              - DFT Overview: quantum-simulation/theory/dft-overview.md
              - Kohn-Sham Equation: quantum-simulation/theory/kohn-sham.md
              - Computational Complexity: quantum-simulation/theory/computational-complexity.md
              - Wannier: quantum-simulation/theory/wannier.md

          - Setup:
              - Installation: quantum-simulation/setup/installation.md

          - Hands-on:
              - SCF Calculation: quantum-simulation/hands-on/scf.md

      - Atomistic Simulation:
          - Overview: atomistic-simulation/index.md

  - Hands-on Project:
      - Research Overview: hands-on-project/index.md

      - Day 1:
          - Modul Workshop DCDFTBMD MACE: hands-on-project/day-1/files/Modul_Workshop_DCDFTBMD_MACE.pdf
          - Modul Workshop DFT QE: hands-on-project/day-1/Komputasi Density Functional Theory (DFT)_QE.pdf
      - Day 2:
          - Overview: hands-on-project/day-2/index.md
          - Preparasi · Persiapan Peserta: hands-on-project/persiapan-peserta.md
          - Sesi 1 · Dari first principles ke molecular dynamics : hands-on-project/day-2/sesi-1-first-principles.md
          - Sesi 3 · Membangun input dan menjalankan DFTB+ : hands-on-project/day-2/sesi-3-menjalankan-dftb.md
          - Sesi 4 · Analisis Lintasan dan Antarmuka : hands-on-project/day-2/sesi-4-analisis-lintasan-dan-antarmuka.md
          - Sesi 5-6 · Pemodelan Material dengan MACE dan diskusi : hands-on-project/day-2/sesi-5-mace.md
          - Bahan Pendalaman : hands-on-project/day-2/bahan-pendalaman.md
          - Modul Workshop DFTBPlus : hands-on-project/day-2/Modul_Workshop_DFTBPlus.pdf

  - Research Cases:
          - Graphene Electronic Structure:
              - Overview: hands-on-project/research-cases/graphene/index.md
              - System Preparation: hands-on-project/research-cases/graphene/system-preparation.md
              - HPC Setup: hands-on-project/research-cases/graphene/hpc-setup.md
              - Analysis: hands-on-project/research-cases/graphene/analysis.md
          - LiTFSI–EMIM/TFSI Electrolyte:
              - Overview: hands-on-project/research-cases/litfsi-emim-tfsi-electrolyte-transport/index.md

          - Graphene–Ionic Liquid Interface:
              - Overview: hands-on-project/research-cases/graphene-ionic-liquid-interface/index.md

          - Battery Electrolyte:
              - Overview: hands-on-project/research-cases/battery-electrolyte/index.md

extra:
  generator: false
  social:

    - icon: fontawesome/brands/github
      link: https://github.com/lala002-brin/MKI-Workshop


  workshop_progress:

    title: "Workshop Roadmap"

    modules:

      - "01 Foundation"

      - "02 First-Principles Simulation"

      - "03 System Design"

      - "04 Accelerated Atomistic Simulation"

      - "05 HPC Environment"

      - "06 AI Materials"

      - "07 Research Cases"


copyright: >
  MKI × BRIN Computational Materials Science Workshop
  <br>
  Developed for scientific computing education


